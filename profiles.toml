# Model profiles and which tier uses which. No secrets here: each profile names
# the macOS Keychain item that holds its key (service, account).
#
# style:    "systemone" (TypeSafe), "anthropic" (Messages API via the Anthropic SDK),
#           "openai" (Chat Completions-compatible, via the OpenAI SDK)
# supports: tools, json_schema, json_object, effort, fallbacks, thinking  (see ladder/llm.py)

[profiles.typesafe]
style = "systemone"
base_url = "https://api.typesafe.ai"
model = "jev-latest"
keychain = { service = "dcss-ladder", account = "typesafe" }

[profiles.anthropic]
style = "anthropic"
base_url = "https://api.anthropic.com"
model = "claude-opus-5"
keychain = { service = "dcss-ladder", account = "anthropic" }
supports = ["tools", "json_schema", "effort", "fallbacks"]
fallbacks = "default"          # re-run a refused request on Anthropic's recommended fallback model

# DeepSeek V4.1 Flash (DeepSeek-V4.1-Flash-1017) over Chat Completions; JSON comes from
# json_object mode with the schema in the prompt. DeepSeek thinks by default (effort high);
# Tactics wants quick answers, so it's off.
[profiles.deepseek-flash]
style = "openai"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
keychain = { service = "dcss-ladder", account = "deepseek" }
supports = ["tools", "json_object", "thinking"]
thinking = "disabled"

# Spare: the same DeepSeek key reaches the Anthropic-style endpoint too.
[profiles.deepseek-anth]
style = "anthropic"
base_url = "https://api.deepseek.com/anthropic"
model = "deepseek-flash"
keychain = { service = "dcss-ladder", account = "deepseek" }
supports = ["tools"]

[tiers]
jev = "typesafe"
tactics = "deepseek-flash"
strategy = "anthropic"
